server {
    listen 80;
    listen [::]:80;
    server_name portfolio.seabyte.pl;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://portfolio.seabyte.pl$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name portfolio.seabyte.pl;

    ssl_certificate /etc/letsencrypt/live/portfolio.seabyte.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portfolio.seabyte.pl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/portfolio/current;
    index index.html;
    charset utf-8;
    error_page 404 /404.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~ /\. {
        deny all;
    }
    location / {
        # Keep Cloudflare from rewriting prerendered React HTML (email obfuscation).
        add_header Cache-Control "no-cache, no-transform";
        try_files $uri $uri/ =404;
    }
}
